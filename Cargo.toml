[workspace]
resolver = "2"
members = ["crates/gpui-cef", "examples/browser", "xtask"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/grovudev/gpui-cef"

[workspace.dependencies]
# runtime_shaders: hand the shader source to Metal at runtime instead of
# compiling it with `xcrun metal` at build time, which removes the need for a
# full Xcode.app install.
# Use the GPUI facade distributed by gpui-kit, matching Unotrop's dependency.
gpui = { package = "gpui-kit", version = "=0.9.1" }
cef = { version = "156.6.0", default-features = false }
log = "0.4"
parking_lot = "0.12"
